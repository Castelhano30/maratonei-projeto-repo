packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true

# Versões publicadas há pouco tempo, liberadas de propósito para a política de idade mínima.
# Remover cada entrada quando a versão passar do prazo configurado.
minimumReleaseAgeExclude:
  - eslint@10.12.0
  - pino@10.4.0
  - supertest@7.3.1
  - '@tanstack/query-core@5.104.1'
  - '@tanstack/react-query@5.104.1'
